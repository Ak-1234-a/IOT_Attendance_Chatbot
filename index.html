<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TCE Mills Employee Leaderboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/lucide-icons-web/dist/icons.css">
</head>
<body class="min-h-screen bg-gray-100">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex items-center justify-between mb-8">
      <div class="flex items-center">
        <i class="icon-trophy w-8 h-8 text-blue-600 mr-3"></i>
        <h1 class="text-2xl font-bold text-gray-900">TCE Mills Employee Leaderboard</h1>
      </div>
    </div>

    <div class="flex flex-wrap gap-2 mb-6" id="categoryNav">
      <button data-category="All" class="flex items-center px-4 py-2 rounded-lg transition-colors bg-blue-600 text-white">
        <i class="icon-users w-5 h-5 mr-2"></i>
        <span>All Employees</span>
      </button>
      <button data-category="Management" class="flex items-center px-4 py-2 rounded-lg transition-colors bg-white text-gray-600 hover:bg-gray-50">
        <i class="icon-building-2 w-5 h-5 mr-2"></i>
        <span>Management</span>
      </button>
      <button data-category="Production" class="flex items-center px-4 py-2 rounded-lg transition-colors bg-white text-gray-600 hover:bg-gray-50">
        <i class="icon-factory w-5 h-5 mr-2"></i>
        <span>Production</span>
      </button>
      <button data-category="Quality" class="flex items-center px-4 py-2 rounded-lg transition-colors bg-white text-gray-600 hover:bg-gray-50">
        <i class="icon-shield w-5 h-5 mr-2"></i>
        <span>Quality</span>
      </button>
      <button data-category="Maintenance" class="flex items-center px-4 py-2 rounded-lg transition-colors bg-white text-gray-600 hover:bg-gray-50">
        <i class="icon-wrench w-5 h-5 mr-2"></i>
        <span>Maintenance</span>
      </button>
    </div>

    <div class="overflow-x-auto bg-white rounded-lg shadow">
      <table class="min-w-full">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Rank</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Employee</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Role</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Department</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Attendance</th>
          </tr>
        </thead>
        <tbody id="leaderboardBody" class="bg-white divide-y divide-gray-200">
          <!-- Rows will be populated dynamically -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const employeesData = `employee_id,name,role,attendance_percentage,department
E001,John Smith,Mill Manager,98.5,Management
E002,Sarah Johnson,Production Supervisor,97.2,Production
E003,Michael Brown,Quality Control Inspector,95.8,Quality
E004,David Wilson,Mechanical Engineer,94.3,Maintenance
E005,Emily Davis,Machine Operator,96.7,Production
E006,James Anderson,Production Supervisor,93.5,Production
E007,Lisa Thompson,Quality Control Inspector,97.8,Quality
E008,Robert Taylor,Maintenance Engineer,95.2,Maintenance
E009,Jennifer Martin,Machine Operator,92.4,Production
E010,William Clark,Mill Manager,98.1,Management`;

    let selectedCategory = 'All';
    const employees = parseCSV(employeesData);

    function parseCSV(csv) {
      const [headers, ...rows] = csv.split('\n');
      return rows
        .filter(row => row.trim())
        .map(row => {
          const [employee_id, name, role, attendance_percentage, department] = row.split(',');
          return {
            employee_id,
            name,
            role,
            attendance_percentage: parseFloat(attendance_percentage),
            department
          };
        })
        .sort((a, b) => b.attendance_percentage - a.attendance_percentage);
    }

    function updateLeaderboard() {
      const filteredEmployees = employees.filter(
        employee => selectedCategory === 'All' || employee.department === selectedCategory
      );

      const tbody = document.getElementById('leaderboardBody');
      tbody.innerHTML = filteredEmployees.map((employee, index) => `
        <tr class="hover:bg-gray-50">
          <td class="px-6 py-4 whitespace-nowrap">
            <div class="flex items-center">
              ${index < 3 
                ? `<i class="icon-trophy w-5 h-5 ${
                    index === 0 ? 'text-yellow-400' :
                    index === 1 ? 'text-gray-400' :
                    'text-amber-600'
                  }"></i>`
                : `<span class="text-gray-900">${index + 1}</span>`
              }
            </div>
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            <div class="flex items-center">
              <div class="flex-shrink-0 h-10 w-10">
                <div class="h-10 w-10 rounded-full bg-gray-200 flex items-center justify-center">
                  <span class="text-lg font-medium text-gray-600">
                    ${employee.name.charAt(0)}
                  </span>
                </div>
              </div>
              <div class="ml-4">
                <div class="text-sm font-medium text-gray-900">${employee.name}</div>
                <div class="text-sm text-gray-500">${employee.employee_id}</div>
              </div>
            </div>
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            <span class="text-sm text-gray-900">${employee.role}</span>
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-blue-100 text-blue-800">
              ${employee.department}
            </span>
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            <div class="flex items-center">
              <div class="w-full bg-gray-200 rounded-full h-2.5 mr-2 w-24">
                <div
                  class="bg-green-600 h-2.5 rounded-full"
                  style="width: ${employee.attendance_percentage}%"
                ></div>
              </div>
              <span class="text-sm text-gray-900">${employee.attendance_percentage}%</span>
            </div>
          </td>
        </tr>
      `).join('');
    }

    // Initialize category navigation
    document.getElementById('categoryNav').addEventListener('click', (e) => {
      const button = e.target.closest('button');
      if (!button) return;

      // Update selected category
      selectedCategory = button.dataset.category;

      // Update button styles
      document.querySelectorAll('#categoryNav button').forEach(btn => {
        btn.className = `flex items-center px-4 py-2 rounded-lg transition-colors ${
          btn.dataset.category === selectedCategory
            ? 'bg-blue-600 text-white'
            : 'bg-white text-gray-600 hover:bg-gray-50'
        }`;
      });

      // Update leaderboard
      updateLeaderboard();
    });

    // Initial render
    updateLeaderboard();
  </script>
</body>
</html>
